# instances.conf — single source of truth for multi-instance layout.
#
# Sourced by the Makefile and scripts/render-instance-env.sh. Bash syntax.
#
# To add an instance:
#   1. Append its name to INSTANCES below.
#   2. Run `make install-instance NAME=<name>` — renders the .env,
#      installs OneCLI on the auto-assigned port triple, registers the
#      systemd unit.
#   3. Install channels exactly like single-install: from a Claude Code
#      session with NCL_INSTANCE=<name> set, run /add-telegram /add-slack
#      etc. The skills route through the instance-aware set-env step and
#      write tokens to instances/<name>/.env for you. No hand-editing.
#
# Ports are auto-derived: the i-th instance (0-indexed) gets the triple
# (ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE,
#  ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 1,
#  ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 2).
#
# Default base is 10354 so it doesn't collide with the legacy single-install
# OneCLI at 10254. Bump the stride if your host has other services occupying
# nearby ports.

INSTANCES="review general"
ONECLI_BASE_PORT=10354
ONECLI_PORT_STRIDE=100
