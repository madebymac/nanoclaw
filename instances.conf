# instances.conf — the layout for this host.
#
# This file IS the configuration. Two NanoClaw instances run from this
# checkout: "review" and "general". Each gets its own host process,
# systemd unit, DB, agent groups, and OneCLI gateway on its own port
# triple. The Makefile sources this file and every target (deploy /
# install / restart / logs / status) loops over INSTANCES.
#
# Sourced by the Makefile and scripts/render-instance-env.sh. Bash syntax.
#
# Adding/removing an instance:
#   1. Edit INSTANCES below.
#   2. Run `make install` — renders any missing per-instance .env files,
#      installs OneCLI per instance on auto-assigned ports, registers
#      one systemd unit per instance.
#   3. From a Claude Code session with NCL_INSTANCE=<name> set, wire
#      channels with /add-telegram, /add-slack, etc. Tokens land in
#      instances/<name>/.env via the instance-aware set-env step.
#
# OneCLI ports are auto-derived per instance index:
#   i-th instance (0-indexed) gets ports
#     (ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE,
#      ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 1,
#      ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 2).
# Default base is 10354 so it doesn't collide with the legacy OneCLI
# default of 10254. Bump the stride if your host has other services on
# nearby ports.
#
# Safety fallback: if this file is missing or INSTANCES is empty, the
# Makefile collapses to legacy single-install behaviour (one host, root
# .env, one systemd unit). That fallback is not the intended mode here
# — it's a guard so a partially-broken install doesn't take down deploy.

INSTANCES="review general"
ONECLI_BASE_PORT=10354
ONECLI_PORT_STRIDE=100
