# instances.conf — the layout for this host.
#
# This file IS the configuration. Multi-instance is the only supported
# mode. Two NanoClaw instances run from this checkout: "review" and
# "general". Each gets its own host process, systemd unit, DB, agent
# groups, and OneCLI gateway on its own port triple. The Makefile sources
# this file and every target (deploy / restart / logs / status) loops
# over INSTANCES.
#
# If this file is missing or INSTANCES is empty, every Makefile target
# fails loudly. There is no single-install fallback.
#
# Sourced by the Makefile and scripts/render-instance-env.sh. Bash syntax.
#
# Adding/removing an instance:
#   1. Edit INSTANCES below.
#   2. Run `make deploy` (or just wait for the next self-upgrade tick) —
#      that's it. `make deploy` is self-bootstrapping: it renders any
#      missing per-instance .env files, installs OneCLI on the auto-
#      assigned port for each new instance, registers the systemd unit
#      if missing, builds, then restarts every instance in the list.
#      Subsequent runs are no-ops on the already-installed bits.
#   3. From a Claude Code session with NCL_INSTANCE=<name> set, wire
#      channels with /add-telegram, /add-slack, etc. Tokens land in
#      instances/<name>/.env via the instance-aware set-env step.
#
# OneCLI ports are auto-derived per instance index:
#   i-th instance (0-indexed) gets ports
#     (ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE,
#      ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 1,
#      ONECLI_BASE_PORT + i*ONECLI_PORT_STRIDE + 2).
# Default base is 10354 so it doesn't collide with the legacy OneCLI
# default of 10254. Bump the stride if your host has other services on
# nearby ports.

INSTANCES="review general"
ONECLI_BASE_PORT=10354
ONECLI_PORT_STRIDE=100
